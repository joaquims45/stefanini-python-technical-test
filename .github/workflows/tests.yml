name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar testes
        # 100% offline (SQLite em memória, sem chamadas externas reais) —
        # ver config/settings/test.py. Os testes marcados "external_api"
        # (opt-in) não rodam aqui.
        run: pytest
