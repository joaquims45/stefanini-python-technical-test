x-backend-env: &backend-env
  POSTGRES_DB: painel_integracoes
  POSTGRES_USER: painel
  POSTGRES_PASSWORD: painel
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  DJANGO_DEBUG: "true"
  DJANGO_ALLOWED_HOSTS: "*"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: painel_integracoes
      POSTGRES_USER: painel
      POSTGRES_PASSWORD: painel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U painel -d painel_integracoes"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  # Roda as migrations uma única vez antes de "backend" e "qcluster"
  # subirem — evita os dois rodarem `migrate` ao mesmo tempo contra um banco
  # recém-criado (gera erro de tabela/constraint duplicada).
  migrate:
    build: ./backend
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment:
      <<: *backend-env
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    environment:
      <<: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

  qcluster:
    build: ./backend
    command: ["python", "manage.py", "qcluster"]
    environment:
      <<: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        # A tela roda no navegador de quem acessa o host, não na rede interna
        # do compose — por isso aponta para a porta publicada (localhost),
        # não para o hostname "backend".
        API_BASE_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
